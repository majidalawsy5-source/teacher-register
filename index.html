<script>
(function(){
'use strict';
const STORAGE_KEY='teacherRegisterProV2';
const APP_NAME='سجل المدرس';
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
let state=null;
let currentTab='home', currentStage=0, currentClass=0;
let dailyState={stage:0,cls:0,cycle:0,queue:[],index:0};
let attendanceState={stage:0,cls:0,date:'',queue:[],index:0,values:{}};
let cloud={cfg:null,user:null,enabled:false,online:navigator.onLine,loading:false,dirty:false};

function arabicDigits(v){return String(v??'').replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]).replace(/\./g,'٫').replace(/,/g,'٬')}
function westernDigits(v){return String(v??'').replace(/[٠-٩]/g,d=>'0123456789'[d.charCodeAt(0)-0x660]).replace(/[۰-۹]/g,d=>'0123456789'[d.charCodeAt(0)-0x6f0]).replace(/[٫]/g,'.').replace(/[٬]/g,',')}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function normalizeName(s){return String(s||'').normalize('NFD').replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[\s\u200f\u200e]+/g,' ').trim().toLowerCase()}
function collator(){return new Intl.Collator('ar',{numeric:false,sensitivity:'base'})}
function sortStudents(cls){cls.students.sort((a,b)=>collator().compare(a.name||'',b.name||''))}
function blankStudent(id,name){return {id,name:name.trim(),photo:'',notes:'',grades:Array(12).fill(null),events:{absent:[],misbehave:[],unprepared:[]}}}
function makeDefault(){return {version:1,updatedAt:Date.now(),deletedStudents:[],meta:{school:'اسم المدرسة',teacher:'اسم المدرس',subject:'اسم المادة',logo:'',nameColWidth:220},stages:[{name:'المرحلة ١',classes:[{name:'الشعبة ١',students:[],attendance:{},recordPhotos:[]}]}]}}
function ensureState(){
 let raw=localStorage.getItem(STORAGE_KEY); if(!raw){state=makeDefault();save(false);return}
 try{state=JSON.parse(raw);normalizeState()}catch(e){state=makeDefault();save(false)}
}
function normalizeState(){
 if(!state||typeof state!=='object') state=makeDefault();
 state.deletedStudents=Array.isArray(state.deletedStudents)?state.deletedStudents:[]; state.meta=state.meta||{}; state.meta.school=state.meta.school??'اسم المدرسة'; state.meta.teacher=state.meta.teacher??'اسم المدرس'; state.meta.subject=state.meta.subject??'اسم المادة'; state.meta.logo=state.meta.logo||''; state.meta.nameColWidth=Math.max(120,Math.min(500,Number(state.meta.nameColWidth)||220));
 if(!Array.isArray(state.stages)||!state.stages.length) state.stages=[{name:'المرحلة ١',classes:[{name:'الشعبة ١',students:[],attendance:{},recordPhotos:[]}]}];
 state.stages.forEach((s,i)=>{s.name=s.name||`المرحلة ${arabicDigits(i+1)}`;if(!Array.isArray(s.classes))s.classes=[];s.classes.forEach((c,j)=>{c.name=c.name||`الشعبة ${arabicDigits(j+1)}`;c.attendance=c.attendance||{};c.recordPhotos=Array.isArray(c.recordPhotos)?c.recordPhotos:[];c.students=Array.isArray(c.students)?c.students:[];c.students.forEach(st=>{st.events=st.events||{};st.notes=st.notes??'';st.events.absent=st.events.absent||[];st.events.misbehave=st.events.misbehave||[];st.events.unprepared=st.events.unprepared||[];st.grades=Array.isArray(st.grades)?st.grades.concat(Array(12).fill(null)).slice(0,12):Array(12).fill(null)}) ;sortStudents(c)})})
 currentStage=Math.min(currentStage,state.stages.length-1); currentClass=Math.min(currentClass,Math.max(0,(state.stages[currentStage].classes.length-1))); if(state.stages[currentStage].classes.length===0) currentClass=-1;
}
function save(markCloud=true){
 state.updatedAt=Date.now();localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
 if(markCloud){cloud.dirty=true;scheduleCloudSync()}
}
function activeStage(){return state.stages[currentStage]}
function activeClass(){return currentClass>=0?activeStage()?.classes[currentClass]:null}
function uid(p='id'){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2300)}
function confirmAction(msg){return Promise.resolve(window.confirm(msg))}
function todayISO(){const d=new Date();const off=d.getTimezoneOffset();return new Date(d.getTime()-off*60000).toISOString().slice(0,10)}
function nowLabel(){return new Intl.DateTimeFormat('ar-IQ',{dateStyle:'full',timeStyle:'short'}).format(new Date())}
function fmtDate(d){if(!d)return '';const [y,m,day]=d.split('-');return `${arabicDigits(day)}/${arabicDigits(m)}/${arabicDigits(y)}`}
function parseGrade(v){v=westernDigits(v).replace(',','.').trim();if(v==='')return null;const n=Number(v);return Number.isFinite(n)?Math.max(0,Math.min(100,Math.round(n))):null}
function gradeText(v){return v===null||v===undefined||v===''?'':arabicDigits(v)}
function roundWhole(n){return Number.isFinite(n)?Math.round(n):null}
function calcAvg(g,a,b,c,d){const vals=[a,b,c,d].map(x=>x==null?null:Number(x)); if(vals.some(x=>x==null||Number.isNaN(x)))return null;return roundWhole(vals.reduce((s,x)=>s+x,0)/4)}
function recalc(st){st.grades[4]=calcAvg(st.grades,st.grades[0],st.grades[1],st.grades[2],st.grades[3]);st.grades[10]=calcAvg(st.grades,st.grades[6],st.grades[7],st.grades[8],st.grades[9]);if(st.grades[4]!=null&&st.grades[5]!=null&&st.grades[10]!=null)st.grades[11]=roundWhole((st.grades[4]+st.grades[5]+st.grades[10])/3);else st.grades[11]=null}
function statFor(cls,index){const vals=cls.students.map(s=>s.grades[index]).filter(v=>v!=null);const pass=vals.filter(v=>Number(v)>=50).length;const fail=vals.filter(v=>Number(v)<50).length;const total=cls.students.length;return {pass,fail,total,pct:total?roundWhole(pass/total*100):0}}
function dateKey(){return todayISO()}
function eventLabel(type){return {absent:'غياب',misbehave:'مشاغبة',unprepared:'غير محضر'}[type]||type}
function iconEvents(st,type){const arr=st.events?.[type]||[];if(!arr.length)return '';const icon=type==='misbehave'?'💢':type==='unprepared'?'❎':'❌';return `<button class="mini-btn ${type==='misbehave'?'amber':type==='unprepared'?'green':'red'}" title="${eventLabel(type)}" data-event-view="${type}" data-student="${st.id}">${icon} ${arr.length>1?arabicDigits(arr.length):''}</button>`}
function hasPhoto(st){return !!st.photo}

function render(){
 normalizeState();
 const c=activeClass();
 $('#app').innerHTML=`<header class="topbar"><div class="top-inner">
 <div class="brand"><img src="${state.meta.logo||'icon.svg'}" alt="شعار"><div><div class="brand-title">${esc(APP_NAME)}</div><div class="brand-sub">سجل إلكتروني للمدرس</div></div></div>
 <div class="context"><span class="pill">المرحلة: <strong>${esc(activeStage()?.name||'—')}</strong></span><span class="pill">الشعبة: <strong>${esc(c?.name||'لا توجد')}</strong></span></div></div>
 <nav class="nav">${tabButton('home','الرئيسية')} ${tabButton('students','الأسماء')} ${tabButton('daily','الاختبار اليومي')} ${tabButton('attendance','سجل الحضور')} ${tabButton('absence','سجل الغياب')} ${tabButton('backup','النسخ الاحتياطي')} ${tabButton('cloud','النسخ السحابي')} ${tabButton('deleted','الطلاب المحذوفين')}</nav></header>
 <main class="page">${renderTab()}</main>`;
 bind();
}
function tabButton(id,label){return `<button type="button" class="tab ${currentTab===id?'active':''}" data-tab="${id}">${label}</button>`}
function renderTab(){switch(currentTab){case'home':return renderHome();case'students':return renderStudents();case'daily':return renderDaily();case'attendance':return renderAttendance();case'absence':return renderAbsence();case'backup':return renderBackup();case'cloud':return renderCloud();case'deleted':return renderDeleted();default:return renderHome()}}
function renderHome(){
 const c=activeClass();
 return `<section class="panel"><div class="hero"><div class="hero-logo">${state.meta.logo?`<img src="${state.meta.logo}" alt="شعار المدرسة">`:'<span class="muted">الشعار</span>'}</div><div class="school-card"><button type="button" class="school-name meta-display-edit" data-meta-edit="school">${esc(state.meta.school)}</button><div class="school-meta"><button type="button" class="meta-chip meta-display-edit" data-meta-edit="teacher">المدرس: ${esc(state.meta.teacher)}</button><button type="button" class="meta-chip meta-display-edit" data-meta-edit="subject">المادة: ${esc(state.meta.subject)}</button></div></div></div>
 <div class="grid" style="margin-top:14px"><div class="col-12 toolbar"><button class="btn primary" id="chooseLogo">📷 ${state.meta.logo?'تغيير الشعار':'إضافة شعار المدرسة'}</button>${state.meta.logo?'<button class="btn soft" id="removeLogo">إزالة الشعار</button>':''}<input id="logoFile" type="file" accept="image/*" hidden></div></div></section>
 <section class="panel"><div class="title-row"><div class="title">المراحل الدراسية</div><button class="btn primary" id="addStage">＋ إضافة مرحلة</button></div><div class="stage-tabs">${state.stages.map((s,i)=>stageChip(s,i)).join('')}</div></section>
 <section class="panel"><div class="title-row"><div class="title">الشُعب ${activeStage().classes.length?'':'(اختيارية)'}</div><button class="btn primary" id="addClass" ${currentStage<0?'disabled':''}>＋ إضافة شعبة</button></div><div class="class-tabs">${activeStage().classes.map((c,i)=>classChip(c,i)).join('')}${activeStage().classes.length===0?'<div class="empty">لا توجد شعبة مضافة. يمكنك استخدام المرحلة مباشرة.</div>':''}</div></section>
 <section class="panel"><div class="title-row"><div class="title">البحث عن طالب</div><div class="hint">يتم تجاهل الفرق بين أ / إ / آ عند البحث</div></div><div class="searchbox"><span class="search-icon">⌕</span><input id="studentSearch" placeholder="اكتب اسم الطالب..."></div><div id="searchResult" class="search-result"></div></section>`}
function stageChip(s,i){return `<div class="chip-menu"><button class="stage-chip ${i===currentStage?'active':''}" data-stage="${i}"><span>${esc(s.name)}</span></button><button class="chip-menu-btn stage-menu-toggle" data-menu="stage-${i}">⋮</button><div class="menu" id="stage-${i}"><button data-stage-rename="${i}">تعديل</button><button class="danger" data-stage-delete="${i}">حذف</button></div></div>`}
function classChip(c,i){return `<div class="chip-menu"><button class="class-chip ${i===currentClass?'active':''}" data-class="${i}"><span>${esc(c.name)}</span></button><button class="chip-menu-btn class-menu-toggle" data-menu="class-${i}">⋮</button><div class="menu" id="class-${i}"><button data-class-rename="${i}">تعديل</button><button class="danger" data-class-delete="${i}">حذف</button></div></div>`}

function headerCell(label,idx){return `<th class="grade-cell">${label}</th>`}
function renderStudents(){
 const c=activeClass(); if(!c)return `<section class="panel"><div class="empty">أضف شعبة أو استخدم المرحلة بدون شعبة، ثم أضف الطلاب.</div></section>`;
 const labels=['شفهي ١ ف١','شهر ١ ف١','شفهي ٢ ف١','شهر ٢ ف١','معدل ف١','نصف السنة','شفهي ١ ف٢','شهر ١ ف٢','شفهي ٢ ف٢','شهر ٢ ف٢','معدل ف٢','السعي السنوي'];
 return `<section class="panel print-area">
 <div class="title-row no-print"><div><div class="title">قائمة أسماء الطلاب والدرجات</div><div class="hint">الدرجات من ٠ إلى ١٠٠ • الحقول المحسوبة تتحدث تلقائياً</div></div><div class="toolbar"><button class="btn primary" id="addStudent">＋ إضافة طالب</button><input id="studentFile" type="file" accept=".txt,.doc,.docx,text/plain,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"></div></div>
 <div class="toolbar no-print" style="margin-bottom:9px"><button class="btn soft" id="printCustomize">🖨️ طباعة مخصصة</button><button class="btn soft" id="printAll">🖨️ طباعة الجدول</button><label class="small" style="display:flex;align-items:center;gap:7px">عرض الاسم <input id="nameColWidth" type="range" min="120" max="500" step="5" value="${state.meta.nameColWidth||220}" style="width:170px"> <b id="nameColWidthValue">${arabicDigits(state.meta.nameColWidth||220)} px</b></label><span class="hint">لا يطبع حقل الملاحظات.</span></div>
 <div class="table-wrap"><table class="grade-table" style="--name-col-width:${state.meta.nameColWidth||220}px"><thead><tr class="print-repeat print-meta-row"><th colspan="18"><div class="print-head"><h1>${esc(state.meta.school)}</h1><div class="meta">المدرس: ${esc(state.meta.teacher)} | المادة: ${esc(state.meta.subject)} | المرحلة: ${esc(activeStage().name)}${c?` | الشعبة: ${esc(c.name)}`:''}</div></div></th></tr><tr><th>ت</th><th class="name-cell">اسم الطالب</th>${labels.map((x,i)=>headerCell(x,i)).join('')}<th class="event-cell no-print">💢 / ❎ / ❌</th><th class="note-cell">الملاحظات</th><th class="no-print photo-btn">الصورة</th><th class="no-print">حذف</th></tr></thead><tbody>${c.students.map((st,i)=>studentRow(st,i)).join('')}${c.students.length?'':`<tr><td colspan="18"><div class="empty">لم تتم إضافة طلاب بعد.</div></td></tr>`}</tbody><tfoot><tr><th colspan="4" class="no-print"></th><th class="stat-under">${renderStatMini(c,4)}</th><th class="stat-under">${renderStatMini(c,5)}</th><th colspan="4" class="no-print"></th><th class="stat-under">${renderStatMini(c,10)}</th><th class="stat-under">${renderStatMini(c,11)}</th><th colspan="4" class="no-print"></th></tr></tfoot></table></div></section>`
}
function studentRow(st,i){recalc(st); const g=st.grades; return `<tr data-student-row="${st.id}"><td>${arabicDigits(i+1)}</td><td class="name-cell"><input class="field name-edit" data-student="${st.id}" value="${esc(st.name)}"></td>${g.map((v,idx)=>idx===4||idx===10||idx===11?`<td class="grade-cell computed ${v!=null&&v<50?'bad':''}">${gradeText(v)}</td>`:`<td class="grade-cell"><input class="grade-input ${v!=null&&v<50?'bad':''}" type="text" inputmode="decimal" pattern="[0-9٠-٩۰-۹]*" data-grade="${idx}" data-student="${st.id}" value="${gradeText(v)}" maxlength="3"></td>`).join('')}<td class="event-cell no-print"><div class="notes-icons"><button class="mini-btn amber" data-event-add="misbehave" data-student="${st.id}" title="إضافة مشاكسة">💢</button><button class="mini-btn green" data-event-add="unprepared" data-student="${st.id}" title="إضافة غير محضر">❎</button></div></td><td class="note-cell no-print"><div class="note-events">${(st.events?.absent||[]).length?`<span class="note-event absent" title="غياب">❌<span class="event-count">${arabicDigits(st.events.absent.length)}</span></span>`:''}${(st.events?.misbehave||[]).length?`<span class="note-event misbehave" title="مشاكسة">💢<span class="event-count">${arabicDigits(st.events.misbehave.length)}</span></span>`:''}${(st.events?.unprepared||[]).length?`<span class="note-event unprepared" title="عدم التحضير">❎<span class="event-count">${arabicDigits(st.events.unprepared.length)}</span></span>`:''}</div><textarea class="student-note" data-note="${st.id}" rows="2" placeholder="ملاحظات...">${esc(st.notes||'')}</textarea></td><td class="no-print">${hasPhoto(st)?`<button class="btn photo-btn has" data-photo-action="menu" data-student="${st.id}">📷 موجودة</button>`:`<button class="btn photo-btn" data-photo-action="add" data-student="${st.id}">📷 إضافة</button>`}</td><td class="no-print"><button class="btn delete-btn" data-student-delete="${st.id}">حذف</button></td></tr>`}
function renderStatMini(c,i){const s=statFor(c,i);return `<div><b>الناجحون:</b> ${arabicDigits(s.pass)}<br><b>الراسبون:</b> ${arabicDigits(s.fail)}<br><b>النسبة:</b> ${arabicDigits(s.pct)}%</div>`}

function renderDaily(){
 const c=activeClass();if(!c)return `<section class="panel"><div class="empty">لا توجد شعبة فعالة.</div></section>`;
 const target=getDailyTarget(c); if(target.field!==dailyState.field||dailyState.stage!==currentStage||dailyState.cls!==currentClass){setupDaily(c)}
 const st=c.students.find(x=>x.id===dailyState.studentId);
 if(!st)return `<section class="panel"><div class="empty">أضف طلاباً أولاً.</div></section>`;
 const done=getDailyProgress(c,dailyState.field); return `<section class="panel"><div class="title-row"><div><div class="title">الاختبار اليومي</div><div class="hint">الهدف الحالي: ${esc(fieldName(dailyState.field))}</div></div><div class="pill" style="background:#f0f4fb;color:var(--navy)">${arabicDigits(done)} / ${arabicDigits(c.students.length)}</div></div><div class="daily-card"><img class="daily-photo" src="${st.photo||'icon.svg'}" alt="صورة الطالب"><div class="daily-name">${esc(st.name)}</div><div class="daily-target">${esc(fieldName(dailyState.field))}</div><div class="daily-score"><label class="small">درجة الشفهي (٠ — ١٠٠)</label><input id="dailyScore" class="field" type="text" inputmode="decimal" pattern="[0-9٠-٩۰-۹]*" maxlength="3" placeholder="مثلاً ٨٠"><div class="daily-actions"><button class="btn green" id="dailyX">❎ غير محضر</button><button class="btn soft" id="dailySkip">تخطي</button><button class="btn primary" id="dailyNext">حفظ والاسم التالي</button></div></div><div class="progress"><div style="width:${c.students.length?Math.round(done/c.students.length*100):0}%"></div></div><div class="hint" style="margin-top:8px">يتم منع التكرار حتى يكتمل العمود المستهدف لكل الطلاب.</div></div></section>`
}
function fieldName(i){return ['شفهي ١ ف١','شهر ١ ف١','شفهي ٢ ف١','شهر ٢ ف١','معدل ف١','نصف السنة','شفهي ١ ف٢','شهر ١ ف٢','شفهي ٢ ف٢','شهر ٢ ف٢','معدل ف٢','السعي السنوي'][i]||''}
function getDailyTarget(c){for(const idx of [0,2,6,8]) if(c.students.some(s=>s.grades[idx]==null))return {field:idx};return {field:8}}
function setupDaily(c){const target=getDailyTarget(c);dailyState={stage:currentStage,cls:currentClass,field:target.field,queue:[],index:0,studentId:null};rebuildDailyQueue(c)}
function rebuildDailyQueue(c){const f=dailyState.field;let candidates=c.students.filter(s=>s.grades[f]==null);for(let i=candidates.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[candidates[i],candidates[j]]=[candidates[j],candidates[i]]}dailyState.queue=candidates.map(s=>s.id);dailyState.index=0;dailyState.studentId=dailyState.queue[0]||null}
function dailyFinished(c){return c.students.length>0&&!c.students.some(s=>s.grades[dailyState.field]==null)}
function getDailyProgress(c,f){return c.students.filter(s=>s.grades[f]!=null).length}
function advanceDaily(c,saveIt=true){if(!dailyFinished(c)){dailyState.index++;dailyState.studentId=dailyState.queue[dailyState.index]||null;if(!dailyState.studentId){rebuildDailyQueue(c)}} else {const target=getDailyTarget(c);dailyState.field=target.field;rebuildDailyQueue(c)} if(saveIt)save();render()}

function renderAttendance(){
 const c=activeClass(); if(!c)return `<section class="panel"><div class="empty">لا توجد شعبة فعالة.</div></section>`;
 if(!attendanceState.date||attendanceState.stage!==currentStage||attendanceState.cls!==currentClass) startAttendance(todayISO(),false);
 const st=c.students.find(x=>x.id===attendanceState.queue[attendanceState.index]);
 if(attendanceState.finished || !st){return attendanceReport()}
 const total=c.students.length, pos=attendanceState.index+1;return `<section class="panel"><div class="title-row"><div><div class="title">سجل الحضور</div><div class="hint">${fmtDate(attendanceState.date)} — ${arabicDigits(pos)} من ${arabicDigits(total)}</div></div><button class="btn soft" id="attendanceBack">↩ العودة للخلف</button></div><div class="attend-card"><img class="att-photo" src="${st.photo||'icon.svg'}" alt="صورة الطالب"><div class="att-name">${esc(st.name)}</div><div class="attendance-actions"><div class="attendance-choice"><button class="btn green" id="markPresent">✓ حاضر</button><button class="btn red" id="markAbsent">✕ غائب</button></div><button class="btn soft delete-btn attendance-delete" id="deleteAttendanceStudent">حذف</button></div><div class="hint" style="margin-top:12px">يمكن الرجوع للخلف لتصحيح آخر حالة.</div></div></section>`
}
function startAttendance(date,reset=true){const c=activeClass();if(!c||!c.students.length){attendanceState={};return}attendanceState={stage:currentStage,cls:currentClass,date,queue:c.students.map(s=>s.id),index:0,values:{},finished:false};const saved=c.attendance?.[date];if(saved)attendanceState.values={...saved};if(!reset){attendanceState.index=0}}
function recordAttendance(value){const c=activeClass();const id=attendanceState.queue[attendanceState.index];attendanceState.values[id]=value; c.attendance=c.attendance||{}; c.attendance[attendanceState.date]=attendanceState.values;const st=c.students.find(s=>s.id===id);if(value==='absent'){st.events.absent=st.events.absent||[]; if(!st.events.absent.includes(attendanceState.date))st.events.absent.push(attendanceState.date)} else {st.events.absent=(st.events.absent||[]).filter(d=>d!==attendanceState.date)}save();if(attendanceState.index<attendanceState.queue.length-1){attendanceState.index++;render()}else{attendanceState.finished=true;save();render()}}
async function deleteCurrentAttendanceStudent(){
 const c=activeClass(); const id=attendanceState.queue[attendanceState.index]; const st=c?.students.find(s=>s.id===id); if(!c||!st)return;
 if(!await confirmAction(`تأكيد حذف الطالب «${st.name}» نهائياً من السجل؟ سيتم حفظ بياناته في الطلاب المحذوفين.`))return;
 state.deletedStudents=state.deletedStudents||[];
 state.deletedStudents.push({id:uid('del'),student:JSON.parse(JSON.stringify(st)),stageName:activeStage().name,className:c.name||'',attendanceHistory:JSON.parse(JSON.stringify(Object.fromEntries(Object.entries(c.attendance||{}).filter(([d,rec])=>Object.prototype.hasOwnProperty.call(rec,st.id))))),deletedAt:todayISO()});
 c.students=c.students.filter(s=>s.id!==id);
 Object.keys(c.attendance||{}).forEach(d=>{if(c.attendance[d])delete c.attendance[d][id]});
 attendanceState.queue=attendanceState.queue.filter(x=>x!==id); delete attendanceState.values[id];
 if(!attendanceState.queue.length||attendanceState.index>=attendanceState.queue.length){attendanceState.finished=true;attendanceState.index=Math.max(0,attendanceState.queue.length-1)}
 else attendanceState.index=Math.min(attendanceState.index,attendanceState.queue.length-1);
 save(); toast('تم حذف الطالب ونقل بياناته إلى الطلاب المحذوفين'); render();
}

function attendanceBack(){if(attendanceState.index>0){attendanceState.index--;render()}else toast('أنت في أول اسم')}
function attendanceReport(){const c=activeClass();const vals=attendanceState.values||{};const present=c.students.filter(s=>vals[s.id]==='present');const absent=c.students.filter(s=>vals[s.id]==='absent');return `<section class="panel"><div class="title-row"><div><div class="title">تقرير الحضور</div><div class="hint">${fmtDate(attendanceState.date)}</div></div><button class="btn primary" id="finishAttendance">العودة للسجل</button></div><div class="report-columns"><div class="report-col present"><h3>الحاضرون (${arabicDigits(present.length)})</h3><ul>${present.map(s=>`<li>${esc(s.name)}</li>`).join('')||'<li>لا يوجد</li>'}</ul></div><div class="report-col absent"><h3>الغائبون (${arabicDigits(absent.length)})</h3><ul>${absent.map(s=>`<li>${esc(s.name)}</li>`).join('')||'<li>لا يوجد</li>'}</ul></div></div></section>`}

function renderAbsence(){
 const c=activeClass();if(!c)return `<section class="panel"><div class="empty">لا توجد شعبة فعالة.</div></section>`;
 const dates=Object.keys(c.attendance||{}).sort().reverse(); const selected=dates[0]||todayISO();const rec=c.attendance?.[selected]||{};const absent=c.students.filter(s=>rec[s.id]==='absent'),present=c.students.filter(s=>rec[s.id]==='present');
 return `<section class="panel"><div class="title-row"><div><div class="title">سجل الغياب</div><div class="hint">اختر تاريخ السجل لعرضه وإضافة صوره وطباعته.</div></div><div class="toolbar"><input id="absenceDate" type="date" value="${selected}"><button class="btn primary" id="newAttendance">＋ سجل اليوم</button></div></div>
 <div class="grid"><div class="col-4"><div class="stat-box fail"><b>الغائبون</b><div class="v">${arabicDigits(absent.length)}</div></div></div><div class="col-4"><div class="stat-box pass"><b>الحاضرون</b><div class="v">${arabicDigits(present.length)}</div></div></div><div class="col-4"><div class="stat-box"><b>عدد الطلاب</b><div class="v">${arabicDigits(c.students.length)}</div></div></div></div>
 <div class="toolbar" style="margin:12px 0"><button class="btn soft" id="addRecordPhoto">📷 إضافة صورة للسجل</button><button class="btn soft" id="printAbsence">🖨️ طباعة السجل</button></div>
 <div class="grid"><div class="col-6"><div class="report-col absent"><h3>الغائبون — ${fmtDate(selected)}</h3><ul class="absence-list">${absent.map(s=>`<li class="absence-row absence-clickable" data-mark-present="${s.id}" title="اضغط على اسم الطالب لتحويله إلى حاضر"><span><span class="dot"></span> ${esc(s.name)}</span><span class="hint">❌ اضغط للاحتساب حاضر</span></li>`).join('')||'<li>لا يوجد</li>'}</ul></div></div><div class="col-6"><div class="report-col present"><h3>الحاضرون — ${fmtDate(selected)}</h3><ul class="absence-list">${present.map(s=>`<li class="absence-row"><span>✓ ${esc(s.name)}</span></li>`).join('')||'<li>لا يوجد</li>'}</ul></div></div></div>
 <div style="margin-top:14px"><div class="title-row"><div class="title">صور سجل هذا اليوم</div></div><div class="photo-grid">${(c.recordPhotos||[]).filter(p=>p.date===selected).map(p=>`<div class="record-photo"><img src="${p.data}" alt="صورة السجل"><div class="cap">${fmtDate(p.date)} <button class="btn link" data-record-photo-delete="${p.id}">حذف</button></div></div>`).join('')||'<div class="hint">لا توجد صور محفوظة لهذا التاريخ.</div>'}</div></div></section>`
}

function renderDeleted(){
 const list=state.deletedStudents||[];

function renderCloud(){return `<section class="panel"><div class="title-row"><div><div class="title">النسخ السحابي</div><div class="hint">اختياري بالكامل. البرنامج يبقى قابلاً للعمل بدون إنترنت حتى لو كان النسخ السحابي غير مفعّل.</div></div></div><div class="cloud-status"><span class="status-dot ${cloud.enabled?'on':'off'}"></span>${cloud.enabled?'النسخ السحابي مفعّل':'النسخ السحابي غير مفعّل'} — ${cloud.online?'متصل بالإنترنت':'غير متصل'}</div><div class="notice">هذه النسخة تستخدم تخزيناً سحابياً عبر Firebase بعد إدخال إعدادات مشروعك. المزامنة التلقائية تحفظ بيانات السجل، أما الصور الكبيرة فتبقى محلية لضمان خفة العمل وعدم تجاوز حدود خدمة السجل.</div><div class="grid" style="margin-top:12px"><div class="col-6"><label class="small">Firebase API Key</label><input id="fbApiKey" value="${esc(cloud.cfg?.apiKey||'')}" placeholder="AIza..." /></div><div class="col-6"><label class="small">Project ID</label><input id="fbProjectId" value="${esc(cloud.cfg?.projectId||'')}" placeholder="my-project" /></div><div class="col-12"><label class="small">اسم المستخدم</label><input id="cloudUser" value="${esc(cloud.user?.username||'')}" placeholder="مثلاً teacher1" /></div><div class="col-6"><label class="small">الرمز السري</label><input id="cloudPass" type="password" placeholder="••••••••" /></div><div class="col-6"><label class="small">إعادة الرمز السري عند إنشاء حساب</label><input id="cloudPass2" type="password" placeholder="••••••••" /></div></div><div class="toolbar" style="margin-top:12px"><button class="btn primary" id="cloudRegister">إنشاء/تفعيل</button><button class="btn dark" id="cloudLogin">تسجيل الدخول</button><button class="btn green" id="cloudSync">مزامنة الآن</button><button class="btn soft" id="cloudLogout">إيقاف النسخ السحابي</button></div><div id="cloudMsg" class="notice hidden"></div><div class="hint" style="margin-top:10px">لإنشاء حساب سحابي أول مرة تحتاج مشروع Firebase مجاني وإيقاف التحقق بالبريد إن كان مفعلاً. راجع ملف README المرفق مع البرنامج.</div></section>`}

function searchStudent(q){const box=$('#searchResult');if(!box)return;const qq=normalizeName(q);if(!qq){box.classList.remove('show');box.innerHTML='';return}const hits=[];state.stages.forEach((s,si)=>s.classes.forEach((c,ci)=>c.students.forEach(st=>{if(normalizeName(st.name).includes(qq))hits.push({st,s,si,c,ci})})));box.classList.add('show');if(!hits.length){box.innerHTML='<div class="empty">لا توجد نتائج.</div>';return}box.innerHTML=hits.map(({st,s,c})=>{recalc(st);return `<div class="panel" style="box-shadow:none;margin:0 0 10px"><div class="student-profile"><div>${st.photo?`<img class="profile-photo" src="${st.photo}" alt="صورة الطالب">`:'<div class="profile-photo placeholder">👤</div>'}</div><div><div class="profile-name">${esc(st.name)}</div><div class="hint">${esc(s.name)} — ${esc(c.name)}</div><div class="data-list" style="margin-top:9px">${st.grades.map((v,i)=>`<div class="data-item"><b>${fieldName(i)}</b>${gradeText(v)||'—'}</div>`).join('')}<div class="data-item"><b>غياب</b>${arabicDigits((st.events.absent||[]).length)}</div><div class="data-item"><b>مشاغبة</b>${arabicDigits((st.events.misbehave||[]).length)}</div><div class="data-item"><b>غير محضر</b>${arabicDigits((st.events.unprepared||[]).length)}</div></div></div></div></div>`}).join('')}

function bindStudents(){
 $('#addStudent')?.addEventListener('click',()=>inputModal('إضافة طالب','اسم الطالب','',async n=>{if(!n)return;const c=activeClass();const st=blankStudent(uid('stu'),n);c.students.push(st);sortStudents(c);save();render()}));
 $('#studentFile')?.addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const names=await parseNameFile(f);const c=activeClass();names.forEach(n=>{if(n)c.students.push(blankStudent(uid('stu'),n))});sortStudents(c);save();toast(`تم استيراد ${arabicDigits(names.length)} اسماً`);render()}catch(err){alert('تعذر قراءة الملف: '+err.message)}e.target.value=''});
 $$('[data-grade]').forEach(inp=>{let original=inp.value;inp.addEventListener('input',()=>{const raw=westernDigits(inp.value).replace(/[^0-9]/g,'').slice(0,3);inp.value=arabicDigits(raw);});inp.addEventListener('blur',async()=>{const st=activeClass().students.find(s=>s.id===inp.dataset.student);if(!st)return;const raw=westernDigits(inp.value).trim();if(raw!==''&&Number(raw)>100){alert('الدرجة يجب أن تكون بين ٠ و١٠٠.');inp.value=original;return}const v=parseGrade(raw);const idx=Number(inp.dataset.grade);const old=st.grades[idx];if(v===old){inp.value=gradeText(old);return}if(!await confirmAction(`تأكيد ${v==null?'حذف':'تعديل'} الدرجة للطالب ${st.name}؟`)){inp.value=gradeText(old);return}st.grades[idx]=v;original=gradeText(v);recalc(st);save();render()})});
 $$('[data-student-delete]').forEach(b=>b.onclick=async()=>{const id=b.dataset.studentDelete;if(!id)return;const c=activeClass();const st=c?.students.find(s=>s.id===id);if(!st)return;if(await confirmAction(`تأكيد حذف اسم الطالب «${st.name}»؟`)){c.students=c.students.filter(s=>s.id!==id);sortStudents(c);save();toast('تم حذف اسم الطالب');render()}});
 $$('[data-note]').forEach(inp=>inp.addEventListener('change',()=>{const st=activeClass().students.find(s=>s.id===inp.dataset.note);if(!st)return;st.notes=inp.value;save()}));
 $$('[data-photo-action]').forEach(b=>b.onclick=()=>photoMenu(b.dataset.student,b.dataset.photoAction));

 $$('[data-event-add]').forEach(b=>b.onclick=()=>addEventFromRow(b.dataset.student,b.dataset.eventAdd));
 $$('[data-student-row] .name-edit').forEach(inp=>inp.addEventListener('change',async()=>{const st=activeClass().students.find(s=>s.id===inp.dataset.student);const next=inp.value.trim()||st.name;if(next===st.name)return;if(!await confirmAction(`تأكيد تعديل اسم الطالب إلى «${next}»؟`)){inp.value=st.name;return}st.name=next;sortStudents(activeClass());save();render()}));
 $('#nameColWidth')?.addEventListener('input',e=>{const w=Math.max(120,Math.min(500,Number(e.target.value)||220));state.meta.nameColWidth=w;const table=document.querySelector('.grade-table');if(table)table.style.setProperty('--name-col-width',w+'px');const out=$('#nameColWidthValue');if(out)out.textContent=arabicDigits(w)+' px';});
 $('#nameColWidth')?.addEventListener('change',()=>save());
  $('#printAll')?.addEventListener('click',()=>window.print());
 $('#printCustomize')?.addEventListener('click',printCustomize);
}
function bindDeleted(){
 $$('[data-restore-student]').forEach(b=>b.onclick=async()=>{const item=state.deletedStudents.find(x=>x.id===b.dataset.restoreStudent);if(!item)return;if(!await confirmAction(`تأكيد استرجاع الطالب «${item.student?.name||''}»؟`))return;let stage=state.stages.find(s=>s.name===item.stageName);if(!stage){stage={name:item.stageName||'مرحلة مسترجعة',classes:[]};state.stages.push(stage)}let cls=stage.classes.find(c=>c.name===item.className);if(!cls){cls={name:item.className||'شعبة مسترجعة',students:[],attendance:{},recordPhotos:[]};stage.classes.push(cls)}if(!cls.students.some(s=>s.id===item.student.id)){cls.students.push(item.student);sortStudents(cls)}cls.attendance=cls.attendance||{};Object.entries(item.attendanceHistory||{}).forEach(([d,rec])=>{cls.attendance[d]=cls.attendance[d]||{};cls.attendance[d][item.student.id]=rec[item.student.id]});state.deletedStudents=state.deletedStudents.filter(x=>x.id!==item.id);currentStage=state.stages.indexOf(stage);currentClass=stage.classes.indexOf(cls);save();toast('تم استرجاع الطالب إلى سجله السابق');render()});
}

function photoMenu(studentId,action){const st=activeClass().students.find(s=>s.id===studentId);if(!st)return;if(action==='add'){openPhotoPicker(studentId,false);return}confirmModal('إدارة صورة الطالب',`<div style="text-align:center"><img src="${st.photo}" style="max-width:220px;max-height:250px;border-radius:18px;object-fit:cover"></div>`,[{text:'مشاهدة',kind:'primary',fn:()=>window.open(st.photo,'_blank')},{text:'استبدال',kind:'green',fn:()=>openPhotoPicker(studentId,true)},{text:'حذف',kind:'red',fn:async()=>{if(await confirmAction('تأكيد حذف صورة الطالب؟')){st.photo='';save();render()}}}])}
function openGenericImagePicker(onData){confirmModal('اختيار الصورة','<div class="toolbar"><button class="btn primary" id="pickGallery">🖼️ اختيار من الاستوديو</button><button class="btn green" id="pickCamera">📷 التقاط بالكاميرا</button></div>',[{text:'إلغاء',kind:'soft'}]);setTimeout(()=>{const make=(capture)=>{const input=document.createElement('input');input.type='file';input.accept='image/*';if(capture)input.capture='environment';input.onchange=async()=>{const f=input.files?.[0];if(!f)return;closeModal();await onData(await fileToOptimizedDataURL(f,1000,0.78))};input.click()};$('#pickGallery')?.addEventListener('click',()=>make(false));$('#pickCamera')?.addEventListener('click',()=>make(true))},0)}
function openPhotoPicker(studentId,replace){openGenericImagePicker(async data=>{const st=activeClass().students.find(s=>s.id===studentId);if(!st)return;st.photo=data;save();render()})}
function addEventFromRow(studentId,type){const st=activeClass().students.find(s=>s.id===studentId);if(!st)return;st.events[type]=st.events[type]||[];st.events[type].push(todayISO());if(type==='unprepared'&&st.events[type].length>=2)alert(`تنبيه: هذا الطالب لديه ${arabicDigits(st.events[type].length)} علامات ❎ غير محضر.`);save();render()}
function showEvents(studentId,type){const st=activeClass().students.find(s=>s.id===studentId);const arr=st?.events?.[type]||[];confirmModal(eventLabel(type),`<div style="display:grid;gap:7px">${arr.length?arr.map((d,i)=>`<div class="data-item"><b>${eventLabel(type)} ${arabicDigits(i+1)}</b>${fmtDate(d)}</div>`).join(''):'لا توجد سجلات.'}</div>`,[{text:'إغلاق',kind:'soft'}])}

function bindDaily(){const c=activeClass();if(!c||!dailyState.studentId){return}$('#dailyX')?.addEventListener('click',()=>{const st=c.students.find(s=>s.id===dailyState.studentId);st.events.unprepared=st.events.unprepared||[];const d=todayISO();if(!st.events.unprepared.includes(d))st.events.unprepared.push(d);if(st.events.unprepared.length>=2)alert('تنبيه: هذا الطالب لديه علامتا ❎ غير محضر.');save();toast('تم تسجيل ❎');advanceDaily(c)});$('#dailySkip')?.addEventListener('click',()=>{advanceDaily(c,false)});$('#dailyNext')?.addEventListener('click',()=>{const st=c.students.find(s=>s.id===dailyState.studentId);const inp=$('#dailyScore');const v=parseGrade(inp.value);if(v==null){alert('أدخل درجة من ٠ إلى ١٠٠.');return}st.grades[dailyState.field]=v;recalc(st);save();advanceDaily(c,false)});
 $('#dailyScore')?.addEventListener('input',e=>{const raw=westernDigits(e.target.value).replace(/[^0-9]/g,'').slice(0,3);e.target.value=arabicDigits(raw)})}
function bindAttendance(){if(attendanceState.date && attendanceState.index<attendanceState.queue.length){$('#markPresent')?.addEventListener('click',()=>recordAttendance('present'));$('#markAbsent')?.addEventListener('click',()=>recordAttendance('absent'));$('#attendanceBack')?.addEventListener('click',attendanceBack);$('#deleteAttendanceStudent')?.addEventListener('click',deleteCurrentAttendanceStudent)}else{$('#finishAttendance')?.addEventListener('click',()=>{currentTab='absence';render()})}}
function bindAbsence(){
 $('#absenceDate')?.addEventListener('change',e=>{const d=e.target.value;attendanceState={stage:currentStage,cls:currentClass,date:d,queue:[],index:0,values:activeClass().attendance?.[d]||{}};render()});

 $$('[data-record-photo-delete]').forEach(b=>b.onclick=async()=>{if(await confirmAction('تأكيد حذف الصورة؟')){activeClass().recordPhotos=(activeClass().recordPhotos||[]).filter(p=>p.id!==b.dataset.recordPhotoDelete);save();render()}}); 
 $$('[data-mark-present]').forEach(b=>b.onclick=async()=>{const id=b.dataset.markPresent;const c=activeClass(),d=$('#absenceDate')?.value||todayISO();if(!c||!id)return;const st=c.students.find(s=>s.id===id);if(!st)return;if(!await confirmAction(`تحويل الطالب «${st.name}» من غائب إلى حاضر في ${fmtDate(d)}؟`))return;c.attendance=c.attendance||{};c.attendance[d]=c.attendance[d]||{};c.attendance[d][id]='present';st.events=st.events||{};st.events.absent=(st.events.absent||[]).filter(x=>x!==d);save();toast('تم تحويل الطالب إلى حاضر');render()});

function bindBackup(){
 $('#exportJson')?.addEventListener('click',downloadFullBackup);
 $('#downloadBackup')?.addEventListener('click',downloadFullBackup);
 $('#importJsonBtn')?.addEventListener('click',()=>$('#importJson').click());
 $('#importJson')?.addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const txt=await f.text();const obj=JSON.parse(txt);if(!obj?.stages)throw new Error('الملف ليس نسخة من سجل المدرس');if(!await confirmAction('سيتم استبدال البيانات الحالية بالنسخة المستوردة. متابعة؟'))return;state=obj;normalizeState();save(false);toast('تم استيراد النسخة بنجاح');render()}catch(err){alert('فشل الاستيراد: '+err.message)}e.target.value=''});
 $('#resetData')?.addEventListener('click',async()=>{if(await confirmAction('سيتم مسح جميع بيانات السجل من هذا المتصفح. هل أنت متأكد؟')&&await confirmAction('تأكيد نهائي: لا يمكن التراجع عن المسح.')){localStorage.removeItem(STORAGE_KEY);state=makeDefault();save(false);render()}})
}
async function downloadFullBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const name=`سجل-المدرس-${todayISO()}.json`;if(window.showSaveFilePicker){try{const h=await window.showSaveFilePicker({suggestedName:name,types:[{description:'JSON',accept:{'application/json':['.json']}}]});const w=await h.createWritable();await w.write(blob);await w.close();toast('تم حفظ النسخة في المكان الذي اخترته');return}catch(e){if(e.name==='AbortError')return}}
const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('تم تنزيل ملف النسخة الاحتياطية')}

function bindCloud(){
 $('#cloudRegister')?.addEventListener('click',()=>cloudAuth(true));$('#cloudLogin')?.addEventListener('click',()=>cloudAuth(false));$('#cloudSync')?.addEventListener('click',()=>syncNow(true));$('#cloudLogout')?.addEventListener('click',()=>{cloud={cfg:cloud.cfg,user:null,enabled:false,online:navigator.onLine,loading:false,dirty:false};localStorage.removeItem('teacherCloudSession');toast('تم إيقاف النسخ السحابي');render()});
}
async function cloudAuth(register){const apiKey=$('#fbApiKey').value.trim(),projectId=$('#fbProjectId').value.trim(),username=$('#cloudUser').value.trim(),pass=$('#cloudPass').value;const pass2=$('#cloudPass2').value;if(!apiKey||!projectId||!username||!pass){showCloudMsg('أكمل إعدادات المشروع واسم المستخدم والرمز السري.',true);return}if(register&&pass!==pass2){showCloudMsg('الرمزان السريان غير متطابقين.',true);return}cloud.cfg={apiKey,projectId};localStorage.setItem('teacherCloudConfig',JSON.stringify(cloud.cfg));
 try{const email=`${normalizeName(username).replace(/[^a-z0-9_-]/gi,'')||'teacher'}@teacher-register.local`;const endpoint=register?'https://identitytoolkit.googleapis.com/v1/accounts:signUp':'https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword';const res=await fetch(`${endpoint}?key=${encodeURIComponent(apiKey)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass,returnSecureToken:true})});const data=await res.json();if(!res.ok)throw new Error(firebaseErr(data));cloud.user={uid:data.localId,token:data.idToken,refreshToken:data.refreshToken,username};cloud.enabled=true;cloud.dirty=true;localStorage.setItem('teacherCloudSession',JSON.stringify({uid:data.localId,refreshToken:data.refreshToken,username}));showCloudMsg(register?'تم إنشاء الحساب وتفعيل النسخ السحابي.':'تم تسجيل الدخول وتفعيل النسخ السحابي.',false);render();await syncNow(true)}catch(e){showCloudMsg('تعذر الاتصال: '+e.message,true)}}
function firebaseErr(d){const m=d?.error?.message||'خطأ غير معروف';return m.replaceAll('_',' ')}
function showCloudMsg(msg,bad){const el=$('#cloudMsg');if(!el)return;el.textContent=msg;el.classList.remove('hidden','warn','ok');el.classList.add(bad?'warn':'ok')}
function scheduleCloudSync(){clearTimeout(scheduleCloudSync.t);if(cloud.enabled&&cloud.online)scheduleCloudSync.t=setTimeout(()=>syncNow(false),1300)}
async function syncNow(manual){if(!cloud.enabled||!cloud.cfg||!cloud.user||!navigator.onLine){if(manual)toast('النسخ السحابي غير جاهز أو الإنترنت غير متوفر');return}if(cloud.loading)return;cloud.loading=true;try{const doc=await cloudGet();if(doc?.fields?.payload?.stringValue){const remote=JSON.parse(doc.fields.payload.stringValue);const remoteTime=Number(doc.fields.updatedAt?.integerValue||0);if(remoteTime>Number(state.updatedAt||0)){if(await confirmAction('توجد نسخة سحابية أحدث. استبدال بيانات الجهاز بها؟')){state=remote;normalizeState();save(false);toast('تم تحميل النسخة السحابية');}}else if(Number(state.updatedAt||0)>remoteTime){await cloudPut();toast('تم رفع النسخة الحالية إلى السحابة')}else if(manual)toast('البيانات متزامنة')}else{await cloudPut();if(manual)toast('تم رفع النسخة الأولى إلى السحابة')}cloud.dirty=false}catch(e){if(manual)alert('تعذر إتمام المزامنة: '+e.message)}finally{cloud.loading=false}}
async function refreshCloudToken(){if(!cloud.cfg||!cloud.user?.refreshToken)return false;const r=await fetch(`https://securetoken.googleapis.com/v1/token?key=${encodeURIComponent(cloud.cfg.apiKey)}`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:`grant_type=refresh_token&refresh_token=${encodeURIComponent(cloud.user.refreshToken)}`});const d=await r.json();if(!r.ok)throw new Error(d?.error?.message||'تعذر تجديد جلسة السحابة');cloud.user.token=d.id_token;cloud.user.refreshToken=d.refresh_token||cloud.user.refreshToken;cloud.user.uid=d.user_id||cloud.user.uid;localStorage.setItem('teacherCloudSession',JSON.stringify({uid:cloud.user.uid,refreshToken:cloud.user.refreshToken,username:cloud.user.username}));return true}
async function cloudGet(){const {apiKey,projectId}=cloud.cfg,uid=cloud.user.uid;const url=`https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/users/${uid}/backup/main?key=${encodeURIComponent(apiKey)}`;const r=await fetch(url,{headers:{Authorization:'Bearer '+cloud.user.token}});if(r.status===404)return null;const d=await r.json();if((r.status===401||r.status===403)&&await refreshCloudToken())return cloudGet();if(!r.ok)throw new Error(d?.error?.message||'Firestore GET failed');return d}
async function cloudPut(){const {apiKey,projectId}=cloud.cfg,uid=cloud.user.uid;const url=`https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/users/${uid}/backup/main?key=${encodeURIComponent(apiKey)}&updateMask.fieldPaths=payload&updateMask.fieldPaths=updatedAt`;const body={fields:{payload:{stringValue:JSON.stringify(stripCloudImages(state))},updatedAt:{integerValue:String(state.updatedAt)}}};const r=await fetch(url,{method:'PATCH',headers:{Authorization:'Bearer '+cloud.user.token,'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if((r.status===401||r.status===403)&&await refreshCloudToken())return cloudPut();if(!r.ok)throw new Error(d?.error?.message||'Firestore PUT failed')}
function stripCloudImages(obj){const copy=JSON.parse(JSON.stringify(obj));copy.meta.logo='';copy.stages.forEach(s=>s.classes.forEach(c=>{c.students.forEach(st=>st.photo='');c.recordPhotos=[]}));return copy}

function printCustomize(){const labels=['شفهي ١ ف١','شهر ١ ف١','شفهي ٢ ف١','شهر ٢ ف١','معدل ف١','نصف السنة','شفهي ١ ف٢','شهر ١ ف٢','شفهي ٢ ف٢','شهر ٢ ف٢','معدل ف٢','السعي السنوي'];confirmModal('تخصيص الطباعة',`<div class="grid" id="printFields">${labels.map((l,i)=>`<label class="data-item"><input type="checkbox" checked data-print-field="${i}"> ${l}</label>`).join('')}</div><div class="notice">سيتم طباعة الأسماء والتسلسل دائماً، ولن يطبع حقل الملاحظات أو أزرار البرنامج.</div>`,[{text:'طباعة',kind:'primary',fn:()=>{const selected=$$('[data-print-field]:checked').map(x=>Number(x.dataset.printField));doPrintColumns(selected)}},{text:'إلغاء',kind:'soft'}])}
function doPrintColumns(fields){$$('.grade-table thead th,.grade-table tbody td,.grade-table tfoot th').forEach(el=>el.classList.remove('hide-print-col'));const map=[...fields];$$('.grade-table tr').forEach(row=>{const cells=[...row.children];cells.forEach((cell,i)=>{if(i>=2&&i<14){const fi=i-2;if(!map.includes(fi))cell.classList.add('hide-print-col')}})});window.print();setTimeout(()=>$$('.hide-print-col').forEach(x=>x.classList.remove('hide-print-col')),500)}
function printAbsenceCustomize(){const dates=Object.keys(activeClass().attendance||{}).sort().reverse();if(!dates.length){alert('لا توجد سجلات حضور بعد.');return}confirmModal('تخصيص طباعة سجل الغياب',`<div class="grid"><div class="col-12"><label class="small">نوع الطباعة</label><select id="absPrintType"><option value="both">الحاضرون والغائبون</option><option value="absent">الغائبون فقط</option><option value="present">الحاضرون فقط</option></select></div><div class="col-12"><label class="small">التواريخ</label><select id="absPrintDates" multiple size="6">${dates.map(d=>`<option value="${d}" selected>${fmtDate(d)}</option>`).join('')}</select></div></div>`,[{text:'طباعة',kind:'primary',fn:()=>printAbsenceSelected($('#absPrintType').value,[...$('#absPrintDates').selectedOptions].map(o=>o.value))},{text:'إلغاء',kind:'soft'}])}
function printAbsenceSelected(type,dates){
 if(!dates.length)return;
 const c=activeClass();
 const old=document.querySelector('.print-absence-temp');if(old)old.remove();
 const wrap=document.createElement('div');wrap.className='print-absence-temp print-only';
 wrap.innerHTML=dates.map(d=>{
   const rec=c.attendance?.[d]||{};
   let rows=[];
   if(type==='both'){
     c.students.forEach((s,i)=>{const status=rec[s.id];if(status==='absent'||status==='present')rows.push({s,status,i:i+1})});
   } else {
     const want=type==='absent'?'absent':'present';
     c.students.forEach((s,i)=>{if(rec[s.id]===want)rows.push({s,status:want,i:i+1})});
   }
   const title=type==='both'?'الحاضرون والغائبون':type==='absent'?'الغائبون فقط':'الحاضرون فقط';
   const head=`<div class="print-head"><h1>${esc(state.meta.school)}</h1><div class="meta">المدرس: ${esc(state.meta.teacher)} | المادة: ${esc(state.meta.subject)} | المرحلة: ${esc(activeStage().name)}${c.name?` | الشعبة: ${esc(c.name)}`:''}</div><h2 style="font-size:13px;margin:7px 0">سجل الغياب والحضور — ${fmtDate(d)}</h2></div>`;
   return `<section class="absence-print-section"><table class="absence-print-table"><thead><tr><th colspan="3">${head}<div style="font-weight:900;margin-top:4px">${title} (${arabicDigits(rows.length)})</div></th></tr><tr><th>ت</th><th>اسم الطالب</th><th>الحالة</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${arabicDigits(i+1)}</td><td>${esc(r.s.name)}</td><td>${r.status==='absent'?'غائب':'حاضر'}</td></tr>`).join('')||'<tr><td colspan="3">لا توجد بيانات لهذا التاريخ.</td></tr>'}</tbody></table></section>`;
 }).join('');
 document.body.appendChild(wrap);
 window.print();
 setTimeout(()=>wrap.remove(),1500);
}
function inputModal(title,label,value,ok){confirmModal(title,`<label class="small">${esc(label)}</label><input id="modalInput" value="${esc(value)}">`,[{text:'حفظ',kind:'primary',fn:async()=>{const v=$('#modalInput').value.trim();closeModal();await ok(v)}},{text:'إلغاء',kind:'soft'}],false)}
function confirmModal(title,html,actions,close=true){const modal=$('#modal');$('#modalBack').classList.add('show');modal.innerHTML=`<div class="modal-head"><h3>${esc(title)}</h3><button class="close" id="modalClose">×</button></div><div class="modal-body">${html}</div><div class="modal-actions">${actions.map((a,i)=>`<button class="btn ${a.kind||'soft'}" data-modal-act="${i}">${esc(a.text)}</button>`).join('')}</div>`;$('#modalClose').onclick=closeModal;actions.forEach((a,i)=>$(`[data-modal-act="${i}"]`).onclick=async()=>{if(a.fn)await a.fn();if(close)closeModal()})}
function closeModal(){$('#modalBack').classList.remove('show');$('#modal').innerHTML=''}

async function parseNameFile(f){const ext=f.name.toLowerCase().split('.').pop();if(ext==='txt')return (await f.text()).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(ext==='docx')return parseDocx(f);if(ext==='doc')return parseLegacyDoc(f);throw new Error('صيغة غير مدعومة')}
async function parseLegacyDoc(f){const text=await f.text();const lines=text.split(/\r?\n/).map(x=>x.replace(/[^\u0600-\u06FF\s]/g,' ').replace(/\s+/g,' ').trim()).filter(x=>x.length>=2);return lines}
async function parseDocx(f){const ab=await f.arrayBuffer();const xml=await extractDocxXml(ab);const doc=new DOMParser().parseFromString(xml,'application/xml');const pars=[...doc.getElementsByTagName('w:p')];return pars.map(p=>[...p.getElementsByTagName('w:t')].map(t=>t.textContent).join(' ').trim()).filter(Boolean)}
async function extractDocxXml(ab){const dv=new DataView(ab),bytes=new Uint8Array(ab);function u16(o){return dv.getUint16(o,true)}function u32(o){return dv.getUint32(o,true)}let eocd=-1;for(let i=bytes.length-22;i>=Math.max(0,bytes.length-66000);i--){if(u32(i)===0x06054b50){eocd=i;break}}if(eocd<0)throw new Error('ملف DOCX غير صالح');const cdSize=u32(eocd+12),cdOffset=u32(eocd+16);let p=cdOffset;while(p<cdOffset+cdSize){if(u32(p)!==0x02014b50)break;const method=u16(p+10),compSize=u32(p+20),nameLen=u16(p+28),extraLen=u16(p+30),commentLen=u16(p+32),localOff=u32(p+42);const name=new TextDecoder().decode(bytes.slice(p+46,p+46+nameLen));if(name==='word/document.xml'){const lp=localOff,ln=u16(lp+26),le=u16(lp+28),dataStart=lp+30+ln+le,raw=bytes.slice(dataStart,dataStart+compSize);let out;if(method===0)out=raw;else if(method===8){if(!('DecompressionStream' in window))throw new Error('المتصفح لا يدعم فك ضغط DOCX محلياً');const ds=new DecompressionStream('deflate-raw');out=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer())}else throw new Error('ضغط DOCX غير مدعوم');return new TextDecoder().decode(out)}p+=46+nameLen+extraLen+commentLen}throw new Error('لم يتم العثور على document.xml داخل DOCX')}
async function fileToDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
async function fileToOptimizedDataURL(file,maxSize,q){const src=await fileToDataURL(file);return new Promise(resolve=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(Math.max(w,h)>maxSize){if(w>=h){h=Math.round(h*maxSize/w);w=maxSize}else{w=Math.round(w*maxSize/h);h=maxSize}}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',q))};img.src=src})}
